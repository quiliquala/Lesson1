<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My Media Gallery</title>
  </head>
  <body>
    <main>
      <h1>My Media Gallery</h1>

      <section>
        <h2>My Favorite Video</h2>
        <p>
          This is a short video that I like to watch again and again. It makes
          me smile every time.
        </p>
        <video
          width="640"
          controls
          preload="metadata"
          poster="images/poster.jpg"
        >
          <source src="videos/my-video.mp4" type="video/mp4" />
          <source src="videos/my-video.webm" type="video/webm" />
          Your browser does not support the video tag.
        </video>
      </section>

      <section>
        <h2>My Favorite Audio</h2>
        <p>
          This is a song that I listen to when I study. It helps me relax and
          focus.
        </p>
        <audio controls preload="none">
          <source src="audio/my-audio.mp3" type="audio/mpeg" />
          <source src="audio/my-audio.ogg" type="audio/ogg" />
          Your browser does not support the audio tag.
        </audio>
      </section>
    </main>
  </body>
</html>
